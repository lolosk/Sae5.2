<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Casino en ligne - Menu</title>
    <link rel="stylesheet" href="css/menu.css">
</head>
<body>

<video autoplay loop muted playsinline class="bg-video">
    <source src="vids/background.mp4" type="video/mp4">
</video>

<header>
    <div class="logo"><h2>🎰 Menu Principal</h2></div>
    <div class="profile">
        <p id="user">Utilisateur : ...</p>
        <p id="credits">Crédits : ... 💰</p>
    </div>
</header>


<div class="menu">
    <div class="game-card" data-sound="slotSound" onclick="location.href='slots.html'">
        <h2>🎰 Machine à sous</h2><p>Tente ta chance avec 3 symboles !</p>
    </div>
    <div class="game-card" data-sound="barSound" onclick="location.href='bar.html'">
        <h2>🥛 Bar</h2><p>Repose toi entre deux partie</p>
    </div>

</div>

<div class="menu">

    <div class="game-card" data-sound="rouletteSound" onclick="location.href='roulette.html'">
        <h2>🎡 Roulette</h2><p>Parie sur le bon numéro.</p>
    </div>
    <div class="game-card" data-sound="blackjackSound" onclick="location.href='horses'">
        <h2>♠️ Black Jack</h2><p>Le 21 est de ton coté ?</p>
    </div>
</div>

<!-- 🎵 Musique de fond -->
<audio id="bgMusic" autoplay loop>
    <source src="sounds/background.mp3" type="audio/mpeg">
    Ton navigateur ne supporte pas l'audio.
</audio>

<!-- 🔊 Bouton son -->
<button id="toggleMusic" class="sound-btn">🔉</button>

<!-- Sons pour chaque boutons -->
<audio id="slotSound"><source src="sounds/slot.wav" type="audio/mpeg"></audio>
<audio id="rouletteSound"><source src="sounds/roulette.wav" type="audio/mpeg"></audio>
<audio id="barSound"><source src="sounds/bar.wav" type="audio/mpeg"></audio>
<audio id="blackjackSound"><source src="sounds/card.wav" type="audio/mpeg"></audio>



<script>
    // Récupère infos depuis le servlet
    fetch("menu")
      .then(res => {
        if (!res.ok) {
          window.location.href = "login.html"; // si pas logué
        }
        return res.json();
      })
      .then(data => {
        if (data.error) {
          window.location.href = "login.html";
        } else {
          document.getElementById("user").textContent = "Utilisateur : " + data.username;
          document.getElementById("credits").textContent = "Crédits : " + data.credits + " 💰";
        }
      });

    const bgMusic = document.getElementById("bgMusic");
    const toggleBtn = document.getElementById("toggleMusic");

    bgMusic.volume = 0.2; // volume plus bas

    let musicEnabled = true;

    toggleBtn.addEventListener("click", () => {
        if (musicEnabled) {
        bgMusic.pause();
        toggleBtn.textContent = "🔇";
        musicEnabled = false;
    } else {
        bgMusic.play();
        toggleBtn.textContent = "🔉";
        musicEnabled = true;
    }
  });


    document.querySelectorAll(".game-card").forEach(card => {
    card.addEventListener("mouseenter", () => {
      const soundId = card.getAttribute("data-sound");
      const audio = document.getElementById(soundId);

      if (audio) {
        audio.currentTime = 0; // reset pour rejouer même si déjà en cours
        audio.play();
      }
    });
  });
</script>

</body>
</html>
