<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>🎰 Casino - Machine à sous</title>
    <link rel="stylesheet" href="css/slots.css">
</head>
<body>

<!-- 🎬 Conteneur principal avec fond -->
<div class="slot-container">

    <!-- Balance & Résultat -->
    <div class="top-info">
        <p id="balance">💰 0</p>
        <p id="spinResult"></p>
    </div>

    <!-- Machine à sous -->
    <div class="slots">
        <div class="reel" id="reel1"></div>
        <div class="reel" id="reel2"></div>
        <div class="reel" id="reel3"></div>
    </div>

    <!-- Boutons de mise -->
    <div class="bet-buttons">
        <button onclick="selectBet(5)">Miser 5</button>
        <button onclick="selectBet(50)">Miser 50</button>
        <button onclick="selectBet(500)">Miser 500</button>
    </div>

    <!-- Buzzer Spin -->
    <button class="spin-btn" onclick="startSpin()">SPIN</button>

    <!-- Bouton son -->
    <button id="toggleMusic" class="sound-btn">🔉</button>

    <!-- 🔊 Audios -->
    <audio id="bgMusic" src="sounds/background.mp3" loop></audio>
    <audio id="reelStopSound" src="sounds/reel-stop.wav"></audio>
    <audio id="winSound" src="sounds/win.mp3"></audio>
    <audio id="loseSound" src="sounds/lose.mp3"></audio>

</div> <!-- fin slot-container -->

<!-- JS -->
<script src="js/slots.js"></script>

</body>
</html>
